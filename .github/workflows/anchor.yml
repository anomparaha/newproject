name: Anchor (Solana program)

# Separate from the Node CI because it needs the Rust + Solana toolchain.
# Run it manually through "Run workflow" until the program is actually in use,
# so the main pipeline stays fast and failures point at the right place.
#
# Toolchain versions are pinned on purpose. Anchor 0.30.1 pairs with the 1.18.x
# Solana CLI; a much newer CLI tends to fail inside `anchor build` with a
# platform-tools mismatch that is hard to read. If the pinned Solana release is
# ever unavailable, the step falls back to stable and says so in the log.
#
# The build and test steps copy their output to a file and, when they fail,
# report the interesting lines as check annotations and as a job summary. The
# raw log of a workflow run is served from a separate host that some networks
# cannot reach, while the Checks API is reachable almost everywhere - so the
# failure has to be readable from the API, not only from the web page.

on:
  workflow_dispatch:
  push:
    paths:
      - 'programs/**'
      - 'Anchor.toml'
      - '.github/workflows/anchor.yml'

env:
  SOLANA_VERSION: v1.18.26
  RUST_VERSION: '1.79.0'
  ANCHOR_VERSION: '0.30.1'

jobs:
  build-and-test:
    name: anchor build + anchor test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo and AVM
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.avm
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install the Solana CLI
        run: |
          set -euo pipefail
          if ! sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"; then
            echo "::warning::Solana ${SOLANA_VERSION} could not be installed; falling back to stable."
            sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Create the throwaway test wallet
        run: |
          set -euo pipefail
          # `anchor test` reads the provider wallet from Anchor.toml and stops
          # when the keypair is missing. A fresh runner has none, and the
          # keypair is not worth caching: the local validator funds whatever
          # address this generates.
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --force \
            -o "$HOME/.config/solana/id.json" < /dev/null
          solana address

      - name: Install the Anchor CLI
        run: |
          set -euo pipefail
          # Install anchor-cli pinned to the v0.30.1 tag directly instead of
          # building avm from Anchor's master branch. Building avm from master
          # pulls a Cargo.lock whose version/MSRV is newer than the pinned Rust
          # toolchain, so `cargo install ... avm --locked` aborted in ~4s before
          # anchor-cli was ever built. The tagged release locks against a Rust
          # version compatible with the one pinned above.
          #
          # The binary lands in ~/.cargo/bin, which the cache restores, so the
          # rebuild only happens on a cold cache.
          if command -v anchor >/dev/null 2>&1; then
            echo "Restored the Anchor CLI from the cache; skipping the rebuild."
          else
            cargo install --git https://github.com/coral-xyz/anchor \
              --tag "v${ANCHOR_VERSION}" anchor-cli --locked --force
          fi
          anchor --version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: programs/vin-anchor/package-lock.json

      # The tests run through ts-mocha, so their own dependencies must be
      # installed before `anchor test` invokes the script in Anchor.toml.
      - name: Install the program test dependencies
        working-directory: programs/vin-anchor
        run: npm ci

      - name: Build the program
        run: |
          set -o pipefail
          anchor build 2>&1 | tee /tmp/anchor-build.log

      - name: Report the build errors
        if: failure()
        run: |
          log=/tmp/anchor-build.log
          [ -s "$log" ] || exit 0

          {
            echo '### The program did not compile'
            echo
            echo '```'
            grep -E '^(error|warning: unused)' -A 3 "$log" | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Annotations are how this failure reaches a reader who can reach the
          # Checks API but not the raw log host. Escape '%' the way the workflow
          # command parser expects.
          grep -E '^(error|error\[)' -A 2 "$log" | head -120 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//%/%25}"
          done
          exit 0

      - name: Run the Anchor tests
        run: |
          set -o pipefail
          anchor test --skip-build 2>&1 | tee /tmp/anchor-test.log

      - name: Report the test failures
        if: failure()
        run: |
          log=/tmp/anchor-test.log
          [ -s "$log" ] || exit 0

          {
            echo '### The tests did not pass'
            echo
            echo '```'
            tail -150 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          tail -60 "$log" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//%/%25}"
          done
          exit 0

      - name: Keep the raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-logs
          path: /tmp/anchor-*.log
          if-no-files-found: ignore

      - name: Save the IDL as an artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vin-anchor-idl
          path: target/idl/vin_anchor.json
          if-no-files-found: warn
