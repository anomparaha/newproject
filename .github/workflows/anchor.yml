name: Anchor (Solana program)

# Separate from the Node CI because it needs the Rust + Solana toolchain.
# Run it manually through "Run workflow" until the program is actually in use,
# so the main pipeline stays fast and failures point at the right place.
#
# Toolchain versions are pinned on purpose. Anchor 0.30.1 pairs with the 1.18.x
# Solana CLI; a much newer CLI tends to fail inside `anchor build` with a
# platform-tools mismatch that is hard to read. If the pinned Solana release is
# ever unavailable, the step falls back to stable and says so in the log.

on:
  workflow_dispatch:
  push:
    paths:
      - 'programs/**'
      - 'Anchor.toml'
      - '.github/workflows/anchor.yml'

env:
  SOLANA_VERSION: v1.18.26
  RUST_VERSION: '1.79.0'
  ANCHOR_VERSION: '0.30.1'

jobs:
  build-and-test:
    name: anchor build + anchor test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo and AVM
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.avm
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install the Solana CLI
        run: |
          set -euo pipefail
          if ! sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"; then
            echo "::warning::Solana ${SOLANA_VERSION} could not be installed; falling back to stable."
            sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Install the Anchor CLI through AVM
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install "${ANCHOR_VERSION}"
          avm use "${ANCHOR_VERSION}"
          anchor --version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: programs/vin-anchor/package-lock.json

      # The tests run through ts-mocha, so their own dependencies must be
      # installed before `anchor test` invokes the script in Anchor.toml.
      - name: Install the program test dependencies
        working-directory: programs/vin-anchor
        run: npm ci

      - name: Build the program
        run: anchor build

      - name: Run the Anchor tests
        run: anchor test --skip-build

      - name: Save the IDL as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: vin-anchor-idl
          path: target/idl/vin_anchor.json
          if-no-files-found: warn
