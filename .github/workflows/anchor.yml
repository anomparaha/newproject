name: Anchor (Solana program)

# Separate from the Node CI because it needs the Rust + Solana toolchain.
# Run it manually through "Run workflow" until the program is actually in use,
# so the main pipeline stays fast and failures point at the right place.
#
# Toolchain generations, learned the hard way. `cargo build-sbf` runs
# `cargo metadata` with the cargo on PATH and then builds with the cargo inside
# the Solana platform-tools. Two different generations in one build does not
# work: the newer cargo writes a version 4 lock file the older bundled cargo
# cannot read, and it resolves crates written for editions the older bundled
# rustc does not know. The repository ships no Cargo.lock, so resolution picks
# today's crates.
#
# Pinning Rust 1.79 because Solana v1.18.26 shipped it was therefore fatal:
# getrandom, block-buffer and friends ask for the 2024 edition and the build
# stopped during metadata, before a line of the program was compiled. Solana and
# Rust now come from stable, so both cargos belong to the same generation.
#
# The Anchor CLI cannot be compiled by a current Rust either, so it comes from
# the prebuilt binary published with the release tag.
#
# TODO: pin both to the exact versions this run reports. The version-reporting
# step prints them, and they belong in these two variables once they are known
# to build the program.
#
# Reading a failure back is part of the job. The raw log of a workflow run and
# the artifacts it uploads are served from hosts that some networks cannot
# reach, while the Checks API is reachable almost everywhere, so the build and
# test steps copy their output to a file and dedicated steps turn it into check
# annotations. GitHub keeps the first ten annotations of each step and drops the
# rest, which is why the reporting is split into a few steps instead of one.

on:
  workflow_dispatch:
  push:
    paths:
      - 'programs/**'
      - 'Anchor.toml'
      - '.github/workflows/anchor.yml'

env:
  SOLANA_VERSION: stable
  RUST_VERSION: stable
  ANCHOR_VERSION: '0.30.1'

jobs:
  build-and-test:
    name: anchor build + anchor test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain is expensive to build (anchor-cli alone is minutes of
      # Rust) and the cache has to survive a failing run, otherwise every
      # iteration pays for it again. Restore here, save near the end.
      # restore/ rather than cache/, because the cache action saves in a post
      # step that GitHub skips when the job fails - exactly the runs whose
      # toolchain we want to keep.
      - name: Restore the toolchain cache
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target
          # A rolling key: the toolchain cache has to survive failing runs, and
          # an immutable key would freeze it at whatever the first run saved.
          key: anchor-${{ runner.os }}-${{ env.ANCHOR_VERSION }}-${{ env.SOLANA_VERSION }}-${{ github.run_id }}
          restore-keys: |
            anchor-${{ runner.os }}-${{ env.ANCHOR_VERSION }}-${{ env.SOLANA_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install the Solana CLI
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Create the throwaway test wallet
        run: |
          set -euo pipefail
          # `anchor test` reads the provider wallet from Anchor.toml and stops
          # when the keypair is missing. A fresh runner has none, and the
          # keypair is not worth caching: the local validator funds whatever
          # address this generates.
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --force \
            -o "$HOME/.config/solana/id.json" < /dev/null
          solana address

      - name: Install the Anchor CLI
        run: |
          set -euo pipefail
          # The binary lands in ~/.cargo/bin, which the cache restores, so this
          # only runs on a cold cache.
          if command -v anchor >/dev/null 2>&1; then
            echo "Restored the Anchor CLI from the cache; skipping the install."
            anchor --version
            exit 0
          fi

          # Anchor 0.30.1 predates the Rust of today: building it with 1.99
          # fails. The release publishes a prebuilt binary for this platform,
          # which is what avm would download anyway; compiling the tagged
          # source with the Rust generation it was written for is the fallback.
          url="https://github.com/coral-xyz/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          if curl -sSfL "$url" -o /tmp/anchor-cli; then
            install -m 0755 /tmp/anchor-cli "$HOME/.cargo/bin/anchor"
            echo "Installed the prebuilt Anchor CLI published with the release."
          else
            echo "::warning::No prebuilt Anchor CLI for this platform; compiling it with Rust 1.79."
            rustup toolchain install 1.79.0 --profile minimal
            cargo +1.79.0 install --git https://github.com/coral-xyz/anchor \
              --tag "v${ANCHOR_VERSION}" anchor-cli --locked --force
          fi
          anchor --version

      - name: Report the toolchain versions
        if: always()
        run: |
          echo "::notice::$(rustc --version 2>&1 | head -1)"
          echo "::notice::$(solana --version 2>&1 | head -1)"
          echo "::notice::$(anchor --version 2>&1 | head -1)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: programs/vin-anchor/package-lock.json

      # The tests run through ts-mocha, so their own dependencies must be
      # installed before `anchor test` invokes the script in Anchor.toml.
      - name: Install the program test dependencies
        working-directory: programs/vin-anchor
        run: npm ci

      # Two commands on purpose. `anchor build` compiles the SBF binary and
      # then generates the IDL, and the IDL step of Anchor 0.30.1 sets
      # RUSTFLAGS=--cfg procmacro2_semver_exempt on its own cargo invocation.
      # That switch turns on proc-macro2's semver-exempt API, which called
      # `Span::source_file()` - a method rustc removed in 1.88 - so on a current
      # stable Rust the IDL step cannot compile: it dies inside proc-macro2 or
      # anchor-syn and fails the whole build. Splitting the two keeps the SBF
      # compile on its normal flags, and the step below drops the switch (cargo
      # prefers CARGO_ENCODED_RUSTFLAGS over RUSTFLAGS). Nothing is lost by
      # dropping it: the switch exists so IDL generation can resolve type
      # aliases and external types, and this program has neither in its IDL.
      - name: Build the program
        run: |
          set -o pipefail
          anchor build --no-idl 2>&1 | tee /tmp/anchor-build.log

      # The output flags matter: `anchor idl build` prints to stdout by default,
      # and both files have to land in the workspace target directory, which is
      # where `anchor test` and the TypeScript tests read them. The log is
      # appended so the reporting steps further down see this failure too.
      - name: Build the IDL
        env:
          CARGO_ENCODED_RUSTFLAGS: ""
        run: |
          set -o pipefail
          anchor idl build \
            --program-name vin-anchor \
            --out target/idl/vin_anchor.json \
            --out-ts target/types/vin_anchor.ts \
            2>&1 | tee -a /tmp/anchor-build.log

      # The tests deploy this exact file into the validator's genesis block. When
      # it is not there the validator exits at startup and the failure reads as a
      # blockhash timeout, which says nothing about the cause, so it is checked
      # here while the build output is still the obvious suspect.
      - name: Check the artifacts the tests use
        run: |
          for f in target/deploy/vin_anchor.so target/idl/vin_anchor.json target/types/vin_anchor.ts; do
            if [ ! -s "$f" ]; then
              echo "::error::missing build artifact: $f"
              find . -name '*.so' -not -path './node_modules/*' 2>/dev/null | head -5
              exit 1
            fi
            ls -l "$f"
          done
          # TEMPORARY DIAGNOSTIC. The test suite behaves as if the validator were
          # running a program other than this source; the marker is a string the
          # program prints from `initialize_config`, so counting it here says
          # whether the deployed binary was built from this commit. The SBF
          # artifact is listed too: `anchor build` copies it into target/deploy,
          # and the copy's mtime hides how old the binary itself is.
          echo "sha256 (deployed): $(sha256sum target/deploy/vin_anchor.so)"
          ls -l --time-style=full-iso target/sbf-solana-solana/release/vin_anchor.so 2>/dev/null || echo "no SBF artifact path"
          echo "marker occurrences: $(strings target/deploy/vin_anchor.so | grep -c 'vin-anchor build marker' || true)"
          strings target/deploy/vin_anchor.so | grep 'vin-anchor build marker' || echo "no marker string in the binary"

      # GitHub keeps ten annotations per step and silently drops the rest, and
      # the useful lines of a failed build sit in different places: the command
      # and its first complaint at the top, the compiler errors in the middle,
      # the summary at the bottom. Three steps cover all of them.
      - name: Report the start of the build log
        if: failure()
        run: |
          log=/tmp/anchor-build.log
          [ -s "$log" ] || exit 0
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" | grep -v '^[[:space:]]*$' | head -10 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          exit 0

      - name: List the build errors
        if: failure()
        run: |
          log=/tmp/anchor-build.log
          [ -s "$log" ] || exit 0
          # The headers alone always fit, and they say how many errors there
          # are and which class they belong to, even when the blocks below hit
          # the ten-annotation ceiling.
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" | grep -E '^error(\[[A-Z0-9]+\])?:' | head -10 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          echo "total errors: $(sed -e 's/\x1b\[[0-9;]*m//g' "$log" | grep -cE '^error(\[[A-Z0-9]+\])?:')"
          exit 0

      - name: Report the errors in the build log
        if: failure()
        run: |
          log=/tmp/anchor-build.log
          [ -s "$log" ] || exit 0
          # One annotation per error, newlines escaped, because a rustc error is
          # a block of code and context. Only blocks that start with "error" -
          # the trailing summary is not an error and it was stealing slots.
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" | awk -v RS='' '/^error/ {
              b = substr($0, 1, 4000);
              gsub(/%/, "%25", b);
              gsub(/\n/, "%0A", b);
              print "::error::" b;
            }' | head -10
          exit 0

      # Everything above is a summary. This is the log itself, folded into 3900
      # character lines so ten of them fit in a step: roughly 39 KB of log, which
      # is more than a failing build of this program produces. The raw log host
      # is unreachable from some networks, and a partial view of a failure has
      # already cost several rounds of guessing.
      - name: Dump the build log
        if: failure()
        run: |
          log=/tmp/anchor-build.log
          [ -s "$log" ] || exit 0
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" | fold -w 3900 | head -10 | while IFS= read -r chunk; do
            echo "::error::${chunk//%/%25}"
          done
          exit 0

      - name: Report the end of the build log
        if: failure()
        run: |
          log=/tmp/anchor-build.log
          [ -s "$log" ] || exit 0
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" | grep -v '^[[:space:]]*$' | tail -10 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          exit 0

      # When the build fails, the first question is usually "where did this
      # dependency come from". cargo tree can answer it, and the answer travels
      # out as annotations like everything else here.
      - name: Diagnose the dependency graph
        if: failure()
        continue-on-error: true
        env:
          MANIFEST: programs/vin-anchor/Cargo.toml
        run: |
          [ -f Cargo.lock ] || exit 0
          echo "::error::lock: $(head -1 Cargo.lock)"
          echo "::error::packages in the lock: $(grep -c '^name = ' Cargo.lock)"
          echo "::error::packages in the normal graph: $(cargo tree --manifest-path "$MANIFEST" -e normal --prefix none 2>/dev/null | sort -u | grep -c .)"
          echo "::error::block-buffer entries in the normal graph: $(cargo tree --manifest-path "$MANIFEST" -e normal --prefix none 2>/dev/null | grep -c '^block-buffer')"
          for dep in $(cargo tree --manifest-path "$MANIFEST" -e normal --prefix none 2>/dev/null | sed 's/ v/-/' | sort -u); do
            dir=$(ls -d "$HOME"/.cargo/registry/src/*/"$dep" 2>/dev/null | head -1)
            if [ -n "$dir" ] && grep -q 'edition = "2024"' "$dir/Cargo.toml" 2>/dev/null; then
              echo "::error::needs the 2024 edition: $dep"
            fi
          done | head -8
          exit 0

      # One line per accounts struct, so the question "which derive produced no
      # impl" is answered by a table instead of by reading a wall of errors.
      - name: Which derives produced an Accounts impl
        if: always()
        run: |
          log=/tmp/anchor-build.log
          if [ ! -s "$log" ]; then echo "no build log"; exit 0; fi
          echo "--- build log: $(wc -l < "$log") lines ---"
          for s in AdminOnly InitializeConfig RegisterActor LockBond SettleBond \
                   OpenDeal FundLeg FreezeDeal ReleaseLeg RefundLeg ResolveDispute \
                   SlashBond RecordNote; do
            if grep -qE "the trait bound \`$s<'_>: (anchor_lang::Accounts|Bumps)" "$log"; then
              echo "MISSING  $s"
            else
              echo "ok       $s"
            fi
          done
          echo "--- anything about the feature, the macro, or a panic ---"
          echo "mint-constraint errors: $(grep -c 'the mint constraint has to be an account field' "$log")"
          grep -n -i "init_if_needed\|init-if-needed\|proc macro\|panicked\|requires that anchor-lang\|the mint constraint" "$log" | head -20
          exit 0

      - name: Collect the build errors for a human reader
        if: failure()
        run: |
          log=/tmp/anchor-build.log
          [ -s "$log" ] || exit 0
          {
            echo '### The program did not compile'
            echo
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' "$log" | tail -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # TEMPORARY DIAGNOSTIC. Prints the code the `Accounts` derive generates
      # for `OpenDeal::try_accounts`, which is where the `deal` seeds check
      # lives: the seeds it derives from, the check it runs, and the values it
      # puts in the error. Remove this step with the rest of the diagnostic.
      - name: TEMPORARY DIAGNOSTIC: expand the Accounts macro for OpenDeal
        if: always()
        run: |
          cd programs/vin-anchor
          RUSTC_BOOTSTRAP=1 cargo rustc --profile=check --lib -- -Zunpretty=expanded > /tmp/expanded.rs 2> /tmp/expanded-err.txt || true
          echo "expanded lines: $(wc -l < /tmp/expanded.rs)"
          echo "--- expand stderr (tail) ---"
          tail -15 /tmp/expanded-err.txt
          echo "--- ConstraintSeeds sites ---"
          grep -n "ConstraintSeeds" /tmp/expanded.rs | head -30
          echo "--- OpenDeal Accounts impl ---"
          awk '/for OpenDeal/{f=1} f{print} f && ++n>260 {exit}' /tmp/expanded.rs | sed -e 's/^/EXPAND: /' | head -260
          echo "--- find_program_address sites ---"
          grep -n "find_program_address" /tmp/expanded.rs | head -20
          exit 0

      - name: Run the Anchor tests
        run: |
          set -o pipefail
          anchor test --skip-build 2>&1 | tee /tmp/anchor-test.log

      - name: Report the start of the test log
        if: failure()
        run: |
          log=/tmp/anchor-test.log
          [ -s "$log" ] || exit 0
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" | grep -v '^[[:space:]]*$' | head -10 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          exit 0

      - name: Report the failing assertions
        if: failure()
        run: |
          log=/tmp/anchor-test.log
          [ -s "$log" ] || exit 0
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" | awk -v RS='' '
            /failing|[Ee]rror|[Aa]ssertion/ {
              b = substr($0, 1, 4000);
              gsub(/%/, "%25", b);
              gsub(/\n/, "%0A", b);
              print "::error::" b;
            }' | head -10
          exit 0

      - name: Dump the test log
        if: failure()
        run: |
          log=/tmp/anchor-test.log
          [ -s "$log" ] || exit 0
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" | fold -w 3900 | head -10 | while IFS= read -r chunk; do
            echo "::error::${chunk//%/%25}"
          done
          exit 0

      - name: Collect the test failures for a human reader
        if: failure()
        run: |
          log=/tmp/anchor-test.log
          [ -s "$log" ] || exit 0
          {
            echo '### The tests did not pass'
            echo
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' "$log" | tail -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # The validator writes to this file and nowhere else, and Anchor's
      # timeout message points at it. Without it, a validator that does not come
      # up is a single line with no cause behind it.
      - name: Show the test validator log
        if: failure()
        run: |
          log=.anchor/test-ledger/test-ledger-log.txt
          if [ ! -s "$log" ]; then
            # A build failure means the tests never started; only say the log is
            # missing when the test step actually ran.
            [ -f /tmp/anchor-test.log ] || exit 0
            echo "::error::no validator log at $log - the validator may have exited before writing one"
            ls -la .anchor/test-ledger 2>/dev/null | head -10
            exit 0
          fi
          cp "$log" /tmp/anchor-validator.log
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" | grep -v '^[[:space:]]*$' | tail -40 | fold -w 3900 | head -10 | while IFS= read -r chunk; do
            echo "::error::${chunk//%/%25}"
          done
          exit 0

      - name: Keep the raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-logs
          path: /tmp/anchor-*.log
          if-no-files-found: ignore

      - name: Save the toolchain cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target
          # A rolling key: the toolchain cache has to survive failing runs, and
          # an immutable key would freeze it at whatever the first run saved.
          key: anchor-${{ runner.os }}-${{ env.ANCHOR_VERSION }}-${{ env.SOLANA_VERSION }}-${{ github.run_id }}

      - name: Save the IDL as an artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vin-anchor-idl
          path: target/idl/vin_anchor.json
          if-no-files-found: warn
