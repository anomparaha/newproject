name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  node:
    name: API + Web + aturan domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instal dependensi
        run: npm ci

      - name: Bangun paket domain bersama
        run: npm run build:shared

      - name: Typecheck (shared, api, web)
        run: npm run typecheck

      - name: Uji aturan inti + uji properti ledger escrow
        run: npm test

      - name: Seed data demo (sekaligus uji integrasi alur penuh)
        run: npm run seed:reset

      - name: Uji asap API (invariant escrow & batas klaim)
        run: npm run smoke

      - name: Build produksi frontend
        run: npm run build --workspace @vin/web
