name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  node:
    name: API + Web + domain rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the shared domain package
        run: npm run build:shared

      - name: Typecheck (shared, api, web)
        run: npm run typecheck

      - name: Core rules tests + escrow ledger property tests
        run: npm test

      - name: Seed demo data (full-flow integration test)
        run: npm run seed:reset

      - name: API smoke test (escrow invariants & claim boundary)
        run: npm run smoke

      - name: Production build of the frontend
        run: npm run build --workspace @vin/web
