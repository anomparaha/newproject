[toolchain]
anchor_version = "0.30.1"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
vin_anchor = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.devnet]
vin_anchor = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[registry]
url = "https://api.apr.dev"

[provider]
# Switch to Helius/QuickNode for devnet and mainnet.
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[test]
# Milliseconds Anchor waits for the validator's RPC to answer before giving up.
# The default is 5000, which a cold runner does not reliably meet: before it
# answers, the validator builds a genesis ledger and loads this program.
startup_wait = 60000

[scripts]
# Anchor runs this from the workspace root. That is where Anchor.toml and
# target/idl live, so staying there is what lets the tests find both; the tests
# are TypeScript with their own package.json, so the ts-mocha binary and the
# tsconfig are named by path instead of relying on the current directory.
test = "programs/vin-anchor/node_modules/.bin/ts-mocha -p programs/vin-anchor/tsconfig.json -t 1000000 'programs/vin-anchor/tests/**/*.ts'"
