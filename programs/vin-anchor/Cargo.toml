[package]
name = "vin-anchor"
version = "0.1.0"
description = "VIN escrow, bonds, and receipt registry. A receipt is not a vehicle title."
edition = "2021"
# MSRV pinned so cargo's MSRV-aware resolver (resolver.incompatible-rust-versions
# = "fallback") selects dependency versions that build on the Solana SBF
# platform-tools rustc. Without this (and with no committed Cargo.lock) resolution
# drifts to crates that require edition2024 / rustc >= 1.80, which neither the SBF
# toolchain nor Anchor's host-side IDL build (ark-ff MontFp) can compile.
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "lib"]
name = "vin_anchor"

[features]
default = []
# `anchor build` generates the IDL by rebuilding the crate with this feature,
# and the tests import the TypeScript types it writes to target/types. Without
# it the build stops before compiling anything.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# CPI to Metaplex Core for minting receipt NFTs. Off by default so the first
# build depends only on anchor-lang + anchor-spl.
metaplex-core = ["dep:mpl-core"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
mpl-core = { version = "0.7", optional = true }

# No Rust-side unit tests: the program is exercised through the Anchor
# TypeScript tests, which build a local validator and drive the instructions
# the way a client does. solana-program-test and solana-sdk used to sit here
# unused, and they dragged the whole banks-server dependency tree into every
# resolution - including crates that need a Rust newer than the platform-tools
# toolchain that actually compiles this program.
