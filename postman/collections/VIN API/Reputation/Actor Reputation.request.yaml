$kind: http-request
name: Actor Reputation
description: |-
  Reputation for an actor: deals completed, disputes opened/lost, on-time report rate, and standard-compliance rate. Recomputed on read.

  `GET /api/reputation/:actorId`
order: 1000
method: GET
url: '{{baseUrl}}/api/reputation/:actorId'
pathVariables:
  - key: actorId
    value: '{{actorId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('has reputation', () => pm.expect(b).to.have.property('reputation'));
      }
