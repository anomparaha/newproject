$kind: http-request
name: List Inspectors
description: |-
  Ranked list of verified inspection workshops. Order comes from report/dispute performance and is not for sale.

  `GET /api/inspectors`
order: 2000
method: GET
url: '{{baseUrl}}/api/inspectors'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('inspectors array', () => { pm.expect(b).to.have.property('inspectors'); pm.expect(b.inspectors).to.be.an('array'); });
      }
