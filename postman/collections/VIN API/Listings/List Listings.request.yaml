$kind: http-request
name: List Listings
description: |-
  List vehicle listings.

  `GET /api/listings`
order: 2000
method: GET
url: '{{baseUrl}}/api/listings'
queryParams:
  - key: status
    value: listed
    disabled: true
  - key: vin
    value: '{{vin}}'
    disabled: true
  - key: sellerId
    value: '{{sellerId}}'
    disabled: true
  - key: corridorId
    value: '{{corridorId}}'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('listings array', () => { pm.expect(b).to.have.property('listings'); pm.expect(b.listings).to.be.an('array'); });
      }
