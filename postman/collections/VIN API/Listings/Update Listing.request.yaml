$kind: http-request
name: Update Listing
description: |-
  Update an existing listing (price, shipping terms, status, etc.).

  `PATCH /api/listings/:id` Requires an `x-actor-id` header identifying the caller.
order: 4000
method: PATCH
url: '{{baseUrl}}/api/listings/:id'
pathVariables:
  - key: id
    value: '{{listingId}}'
headers:
  - key: x-actor-id
    value: '{{sellerId}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "priceAmount": "17500",
      "shippingTerms": "CIF destination port; seller covers ocean freight.",
      "location": "Long Beach, US",
      "odometerKm": 42050,
      "photoHashes": ["{{sha256}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('object body', () => pm.expect(b).to.be.an('object'));
      }
