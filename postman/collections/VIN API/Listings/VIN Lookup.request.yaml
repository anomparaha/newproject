$kind: http-request
name: VIN Lookup
description: |-
  Look up the full history recorded against a VIN/chassis number (listings, reports, odometer readings).

  `GET /api/vin/:vin`
order: 5000
method: GET
url: '{{baseUrl}}/api/vin/:vin'
pathVariables:
  - key: vin
    value: '{{vin}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('object body', () => pm.expect(b).to.be.an('object'));
      }
