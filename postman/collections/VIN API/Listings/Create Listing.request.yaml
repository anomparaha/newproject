$kind: http-request
name: Create Listing
description: |-
  Create a vehicle listing locked to a VIN/chassis number. A listing above the corridor value threshold also requires seller verification and a locked bond.

  `POST /api/listings` Requires an `x-actor-id` header identifying the caller.
order: 1000
method: POST
url: '{{baseUrl}}/api/listings'
headers:
  - key: Content-Type
    value: application/json
  - key: x-actor-id
    value: '{{sellerId}}'
body:
  type: json
  content: |-
    {
      "vin": "{{vin}}",
      "sellerId": "{{sellerId}}",
      "make": "Toyota",
      "model": "Corolla",
      "year": 2021,
      "odometerKm": 42000,
      "location": "Los Angeles, US",
      "priceAmount": "18000",
      "priceCurrency": "USD",
      "shippingTerms": "FOB seller port; buyer covers ocean freight and import duties.",
      "photoHashes": ["{{sha256}}"],
      "bond": {
        "amount": "500",
        "currency": "USDC"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('has listing', () => pm.expect(b).to.have.property('listing'));
      }
