$kind: http-request
name: Get Listing
description: |-
  Fetch a single listing by id.

  `GET /api/listings/:id`
order: 3000
method: GET
url: '{{baseUrl}}/api/listings/:id'
pathVariables:
  - key: id
    value: '{{listingId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('has listing', () => pm.expect(b).to.have.property('listing'));
      }
