$kind: http-request
name: '6. Corridor'
description: |-
  Setup step (6. Corridor) that seeds baseline demo data used by the other folders. Run the whole `0. Setup` folder after every `npm run seed:reset`, because seeding mints fresh IDs.

  `GET /api/corridors`
order: 600
method: GET
url: '{{baseUrl}}/api/corridors'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('corridors 200', () => pm.response.to.have.status(200));
      const corridors = pm.response.json().corridors || [];
      const corridor = corridors[0] || {};
      pm.collectionVariables.set('corridorId', corridor.id || '');
      pm.test('a corridor was captured', () => pm.expect(corridor.id).to.be.a('string').and.not.empty);
