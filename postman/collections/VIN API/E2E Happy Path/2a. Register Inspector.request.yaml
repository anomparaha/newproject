$kind: http-request
name: '2a. Register Inspector'
description: |-
  End-to-end happy-path step: 2a. Register Inspector. Runs in order to take a listing from creation through funded escrow, inspection, acceptance, handover, and vehicle release.

  `POST /api/actors`
order: 210
method: POST
url: '{{baseUrl}}/api/actors'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "role": "inspector",
      "displayName": "E2E Fresh Inspector",
      "email": "e2e.inspector.{{$timestamp}}@vin.demo",
      "countryCode": "AE",
      "city": "Sharjah"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('register inspector 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      pm.collectionVariables.set('e2eInspectorId', pm.response.json().actor.id);
