$kind: http-request
name: '2b. Bond Inspector Capacity'
description: |-
  End-to-end happy-path step: 2b. Bond Inspector Capacity. Runs in order to take a listing from creation through funded escrow, inspection, acceptance, handover, and vehicle release.

  `POST /api/actors/:id/bonds`
order: 220
method: POST
url: '{{baseUrl}}/api/actors/:id/bonds'
pathVariables:
  - key: id
    value: '{{e2eInspectorId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amount": "500",
      "currency": "USDC",
      "purpose": "inspection_capacity"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('bond capacity 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
