$kind: http-request
name: '2. Register Buyer'
description: |-
  End-to-end happy-path step: 2. Register Buyer. Runs in order to take a listing from creation through funded escrow, inspection, acceptance, handover, and vehicle release.

  `POST /api/actors`
order: 200
method: POST
url: '{{baseUrl}}/api/actors'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "role": "buyer",
      "displayName": "E2E Flow Buyer",
      "email": "e2e.buyer.{{$timestamp}}@vin.demo",
      "countryCode": "SG",
      "city": "Singapore"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('register buyer 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      pm.collectionVariables.set('e2eBuyerId', pm.response.json().actor.id);
