$kind: http-request
name: '5. Fund Deal'
description: |-
  End-to-end happy-path step: 5. Fund Deal. Runs in order to take a listing from creation through funded escrow, inspection, acceptance, handover, and vehicle release.

  `POST /api/deals/:id/fund` Requires an `x-actor-id` header identifying the caller.
order: 500
method: POST
url: '{{baseUrl}}/api/deals/:id/fund'
pathVariables:
  - key: id
    value: '{{e2eDealId}}'
headers:
  - key: x-actor-id
    value: '{{e2eBuyerId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('fund 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      pm.test('state inspecting', () => pm.expect(pm.response.json().deal.state).to.eql('inspecting'));
