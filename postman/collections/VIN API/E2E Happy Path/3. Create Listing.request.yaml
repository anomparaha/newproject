$kind: http-request
name: '3. Create Listing'
description: |-
  End-to-end happy-path step: 3. Create Listing. Runs in order to take a listing from creation through funded escrow, inspection, acceptance, handover, and vehicle release.

  `POST /api/listings` Requires an `x-actor-id` header identifying the caller.
order: 300
method: POST
url: '{{baseUrl}}/api/listings'
headers:
  - key: Content-Type
    value: application/json
  - key: x-actor-id
    value: '{{e2eSellerId}}'
body:
  type: json
  content: |-
    {
      "vin": "E2E{{$timestamp}}X",
      "sellerId": "{{e2eSellerId}}",
      "make": "Honda",
      "model": "Brio",
      "year": 2020,
      "odometerKm": 20000,
      "location": "Dubai, United Arab Emirates",
      "priceAmount": "9000",
      "priceCurrency": "USDC",
      "shippingTerms": "FOB Jebel Ali; buyer covers ocean freight.",
      "photoHashes": ["{{sha256}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('create listing 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      const b = pm.response.json(); const l = b.listing || b;
      pm.collectionVariables.set('e2eListingId', l.id);
      pm.collectionVariables.set('e2eVin', l.vin);
