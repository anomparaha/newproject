$kind: http-request
name: '3. Create Listing'
order: 300
method: POST
url: '{{baseUrl}}/api/listings'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "vin": "E2E{{$timestamp}}X",
      "sellerId": "{{e2eSellerId}}",
      "make": "Honda",
      "model": "Brio",
      "year": 2020,
      "odometerKm": 20000,
      "location": "Jakarta, Indonesia",
      "priceAmount": "9000",
      "priceCurrency": "USDC",
      "shippingTerms": "FOB Jakarta; buyer covers ocean freight.",
      "photoHashes": ["{{sha256}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('create listing 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      const b = pm.response.json(); const l = b.listing || b;
      pm.collectionVariables.set('e2eListingId', l.id);
      pm.collectionVariables.set('e2eVin', l.vin);
