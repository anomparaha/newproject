$kind: http-request
name: '7. Accept Report'
description: |-
  End-to-end happy-path step: 7. Accept Report. Runs in order to take a listing from creation through funded escrow, inspection, acceptance, handover, and vehicle release.

  `POST /api/deals/:id/reports/:reportId/accept` Requires an `x-actor-id` header identifying the caller.
order: 700
method: POST
url: '{{baseUrl}}/api/deals/:id/reports/:reportId/accept'
pathVariables:
  - key: id
    value: '{{e2eDealId}}'
  - key: reportId
    value: '{{e2eReportId}}'
headers:
  - key: Content-Type
    value: application/json
  - key: x-actor-id
    value: '{{e2eBuyerId}}'
body:
  type: json
  content: |-
    {
      "buyerId": "{{e2eBuyerId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('accept 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      pm.test('state inspection_accepted', () => pm.expect(pm.response.json().deal.state).to.eql('inspection_accepted'));
