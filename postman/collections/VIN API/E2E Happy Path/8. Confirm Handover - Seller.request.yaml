$kind: http-request
name: '8. Confirm Handover - Seller'
description: |-
  End-to-end happy-path step: 8. Confirm Handover - Seller. Runs in order to take a listing from creation through funded escrow, inspection, acceptance, handover, and vehicle release.

  `POST /api/deals/:id/handover` Requires an `x-actor-id` header identifying the caller.
order: 800
method: POST
url: '{{baseUrl}}/api/deals/:id/handover'
pathVariables:
  - key: id
    value: '{{e2eDealId}}'
headers:
  - key: Content-Type
    value: application/json
  - key: x-actor-id
    value: '{{e2eSellerId}}'
body:
  type: json
  content: |-
    {
      "actorId": "{{e2eSellerId}}",
      "evidenceHash": "{{sha256}}",
      "method": "handover_location_confirmed"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('handover seller 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
