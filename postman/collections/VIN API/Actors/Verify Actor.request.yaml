$kind: http-request
name: Verify Actor
description: |-
  Raise an actor's verification level. Only a `curator` may call this, so the `x-actor-id` header must be a curator's id.

  `POST /api/actors/:id/verify` — body: `level` (e.g. `business_verified`) and an optional `note`. Returns the updated actor.
order: 5000
method: POST
url: '{{baseUrl}}/api/actors/:id/verify'
pathVariables:
  - key: id
    value: '{{actorId}}'
headers:
  - key: x-actor-id
    value: '{{curatorId}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "level": "business_verified",
      "note": "Business documents validated by corridor curator."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
