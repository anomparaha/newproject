$kind: http-request
name: Lock Bond
description: |-
  Lock a stablecoin bond for an actor. Bonds are collateral the actor stakes to participate (e.g. to create a listing above a value threshold, or to reserve inspector capacity).

  `POST /api/actors/:id/bonds` — body: `amount` (string), `currency` (e.g. `USDC`), `purpose` (e.g. `listing`), and optionally `listingId`. Returns the created bond.
order: 4000
method: POST
url: '{{baseUrl}}/api/actors/:id/bonds'
pathVariables:
  - key: id
    value: '{{actorId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amount": "500",
      "currency": "USDC",
      "purpose": "listing",
      "listingId": "{{listingId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
