$kind: http-request
name: Get Actor
description: |-
  Retrieve a single actor's profile, bonds, and reputation.

  `GET /api/actors/:id` — no authentication required. Returns `200` with `{ actor, bonds, reputation }`, or `404` if the actor does not exist.
order: 3000
method: GET
url: '{{baseUrl}}/api/actors/:id'
pathVariables:
  - key: id
    value: '{{actorId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('actor returned', () => pm.expect(b).to.have.property('actor'));
      }
