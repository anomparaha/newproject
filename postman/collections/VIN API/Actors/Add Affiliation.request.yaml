$kind: http-request
name: Add Affiliation
order: 6000
method: POST
url: '{{baseUrl}}/api/actors/:id/affiliations'
pathVariables:
  - key: id
    value: '{{actorId}}'
headers:
  - key: x-actor-id
    value: '{{curatorId}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "relatedActorId": "{{inspectorId}}",
      "note": "Workshop affiliated with this seller."
    }
