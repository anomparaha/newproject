$kind: http-request
name: Add Affiliation
description: |-
  Record an affiliation between two actors (e.g. link an inspection workshop to a seller). Requires a `curator` in the `x-actor-id` header.

  `POST /api/actors/:id/affiliations` — body: `relatedActorId` (required) and an optional `note`. Returns the created affiliation.
order: 6000
method: POST
url: '{{baseUrl}}/api/actors/:id/affiliations'
pathVariables:
  - key: id
    value: '{{actorId}}'
headers:
  - key: x-actor-id
    value: '{{curatorId}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "relatedActorId": "{{inspectorId}}",
      "note": "Workshop affiliated with this seller."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
