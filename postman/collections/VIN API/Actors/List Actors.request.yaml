$kind: http-request
name: List Actors
description: |-
  List registered actors (sellers, buyers, inspection workshops, curators, arbiters).

  `GET /api/actors` — no authentication required. Optional query filters: `role` and `country` (ISO-2 code, case-insensitive). Returns `{ actors: [...] }` ordered newest-first.
order: 2000
method: GET
url: '{{baseUrl}}/api/actors'
queryParams:
  - key: role
    value: inspector
    disabled: true
  - key: country
    value: US
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('actors array', () => { pm.expect(b).to.have.property('actors'); pm.expect(b.actors).to.be.an('array'); });
      }
