$kind: http-request
name: Resolve Dispute
description: |-
  Arbiter rules on a dispute (for example refund the buyer) and settles both the vehicle and inspection legs.

  `POST /api/disputes/:id/resolve` Requires an `x-actor-id` header identifying the caller.
order: 8000
method: POST
url: '{{baseUrl}}/api/disputes/:id/resolve'
pathVariables:
  - key: id
    value: '{{disputeId}}'
headers:
  - key: x-actor-id
    value: '{{arbiterId}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "arbiterId": "{{arbiterId}}",
      "outcome": "refund_buyer",
      "refundedAmount": "150",
      "arbiterNote": "Buyer refunded; inspection standard not met and odometer anomaly confirmed."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('object body', () => pm.expect(b).to.be.an('object'));
      }
