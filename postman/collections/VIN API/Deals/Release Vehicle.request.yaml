$kind: http-request
name: Release Vehicle
description: |-
  Release the vehicle-leg escrow funds to the seller once the handover preconditions are met.

  `POST /api/deals/:id/release-vehicle` Requires an `x-actor-id` header identifying the caller.
order: 6000
method: POST
url: '{{baseUrl}}/api/deals/:id/release-vehicle'
pathVariables:
  - key: id
    value: '{{dealId}}'
headers:
  - key: x-actor-id
    value: '{{buyerId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('object body', () => pm.expect(b).to.be.an('object'));
      }
