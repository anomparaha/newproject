$kind: http-request
name: Upload Report
description: |-
  Inspection workshop uploads its report for the deal. The odometer reading is checked against the VIN's highest recorded value (max-odometer baseline) to flag rollback anomalies.

  `POST /api/deals/:id/reports` Requires an `x-actor-id` header identifying the caller.
order: 3000
method: POST
url: '{{baseUrl}}/api/deals/:id/reports'
pathVariables:
  - key: id
    value: '{{dealId}}'
headers:
  - key: x-actor-id
    value: '{{inspectorId}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "inspectorId": "{{inspectorId}}",
      "odometerKm": 42060,
      "inspectedAt": "2026-10-02T10:00:00.000Z",
      "reportHash": "{{sha256}}",
      "dashboardPhotoHash": "{{sha256}}",
      "conditionSummary": "No structural damage. Minor cosmetic wear consistent with the stated mileage.",
      "standardVersion": "v1",
      "checklist": {
        "vin_matches_unit": true,
        "dashboard_photo": true,
        "odometer_documented": true,
        "main_condition": true,
        "date_and_location": true
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('has report', () => pm.expect(b).to.have.property('report'));
      }
