$kind: http-request
name: List Notes
description: |-
  List digital receipts (notes) — the immutable proof records produced by completed deals.

  `GET /api/notes`
order: 12000
method: GET
url: '{{baseUrl}}/api/notes'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('notes array', () => { pm.expect(b).to.have.property('notes'); pm.expect(b.notes).to.be.an('array'); });
      }
