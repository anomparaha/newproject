$kind: http-request
name: Get Deal
description: |-
  Fetch a single deal together with its events, inspection reports, dispute, and digital receipts.

  `GET /api/deals/:id`
order: 10000
method: GET
url: '{{baseUrl}}/api/deals/:id'
pathVariables:
  - key: id
    value: '{{dealId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('has deal', () => pm.expect(b).to.have.property('deal'));
      }
