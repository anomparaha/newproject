$kind: http-request
name: Confirm Handover
description: |-
  Buyer or seller confirms physical handover of the vehicle. Both confirmations are needed before funds release.

  `POST /api/deals/:id/handover` Requires an `x-actor-id` header identifying the caller.
order: 5000
method: POST
url: '{{baseUrl}}/api/deals/:id/handover'
pathVariables:
  - key: id
    value: '{{dealId}}'
headers:
  - key: x-actor-id
    value: '{{actorId}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "actorId": "{{actorId}}",
      "evidenceHash": "{{sha256}}",
      "method": "mutual_confirmation"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('object body', () => pm.expect(b).to.be.an('object'));
      }
