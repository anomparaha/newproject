$kind: http-request
name: Accept Report
description: |-
  Buyer accepts the uploaded inspection report, which releases the inspection fee to the workshop (minus the platform fee).

  `POST /api/deals/:id/reports/:reportId/accept` Requires an `x-actor-id` header identifying the caller.
order: 4000
method: POST
url: '{{baseUrl}}/api/deals/:id/reports/:reportId/accept'
pathVariables:
  - key: id
    value: '{{dealId}}'
  - key: reportId
    value: '{{reportId}}'
headers:
  - key: x-actor-id
    value: '{{buyerId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('object body', () => pm.expect(b).to.be.an('object'));
      }
