$kind: http-request
name: Deal Escrows
description: |-
  List the escrow legs (vehicle + inspection) for a deal and their current status.

  `GET /api/deals/:id/escrows`
order: 11000
method: GET
url: '{{baseUrl}}/api/deals/:id/escrows'
pathVariables:
  - key: id
    value: '{{dealId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('escrows array', () => { pm.expect(b).to.have.property('escrows'); pm.expect(b.escrows).to.be.an('array'); });
      }
