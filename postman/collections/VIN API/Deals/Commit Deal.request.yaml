$kind: http-request
name: Commit Deal
description: |-
  Buyer locks a deal against a listing and chooses the inspection workshop. Starts the escrow lifecycle.

  `POST /api/listings/:id/deals`
order: 1000
method: POST
url: '{{baseUrl}}/api/listings/:id/deals'
pathVariables:
  - key: id
    value: '{{listingId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "buyerId": "{{buyerId}}",
      "inspectorId": "{{inspectorId}}",
      "shippingPaidBy": "buyer",
      "shippingAmount": "800",
      "inspectionFeeAmount": "150",
      "escrowCurrency": "USDC",
      "inspectionDeadlineHours": 72,
      "handoverTerms": "Funds release to the seller only after both parties confirm handover at the destination port."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('has deal', () => pm.expect(b).to.have.property('deal'));
      }
