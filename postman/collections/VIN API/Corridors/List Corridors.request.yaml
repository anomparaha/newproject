$kind: http-request
name: List Corridors
description: |-
  List trade corridors that are open or candidate, each with its own rules (minimum vehicle value, allowed currencies, mandatory inspection).

  `GET /api/corridors`
order: 1000
method: GET
url: '{{baseUrl}}/api/corridors'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('corridors array', () => { pm.expect(b).to.have.property('corridors'); pm.expect(b.corridors).to.be.an('array'); });
      }
