$kind: http-request
name: Create Corridor
description: |-
  Open a new trade corridor. Only a curator may open one, and only once the existing corridor is healthy (enough completed deals, dispute rate under control).

  `POST /api/corridors` Requires an `x-actor-id` header identifying the caller.
order: 2000
method: POST
url: '{{baseUrl}}/api/corridors'
headers:
  - key: Content-Type
    value: application/json
  - key: x-actor-id
    value: '{{curatorId}}'
body:
  type: json
  content: |-
    {
      "originCountry": "US",
      "destinationCountry": "ID",
      "minVehiclePriceUsd": 5000,
      "allowedCurrencies": ["USDC", "USD"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('has corridor', () => pm.expect(b).to.have.property('corridor'));
      }
