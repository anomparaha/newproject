$kind: http-request
name: Corridor Metrics
description: |-
  Public health metrics for a corridor: completed deals, median time-to-report, dispute rate, plus the thresholds that halt expansion.

  `GET /api/corridors/:id/metrics`
order: 3000
method: GET
url: '{{baseUrl}}/api/corridors/:id/metrics'
pathVariables:
  - key: id
    value: '{{corridorId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('object body', () => pm.expect(b).to.be.an('object'));
      }
