$kind: http-request
name: '5. Create Listing (high odometer)'
description: |-
  End-to-end dispute-path step: 5. Create Listing (high odometer). Runs in order to drive a deal into a dispute and an arbiter-ordered buyer refund.

  `POST /api/listings` Requires an `x-actor-id` header identifying the caller.
order: 500
method: POST
url: '{{baseUrl}}/api/listings'
headers:
  - key: Content-Type
    value: application/json
  - key: x-actor-id
    value: '{{dspSellerId}}'
body:
  type: json
  content: |-
    {
      "vin": "DSP{{$timestamp}}X",
      "sellerId": "{{dspSellerId}}",
      "make": "Toyota",
      "model": "Avanza",
      "year": 2019,
      "odometerKm": 90000,
      "location": "Dubai, United Arab Emirates",
      "priceAmount": "9000",
      "priceCurrency": "USDC",
      "shippingTerms": "FOB Jebel Ali; seller covers freight.",
      "photoHashes": ["{{sha256}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('create listing 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      const b = pm.response.json(); const l = b.listing || b;
      pm.collectionVariables.set('dspListingId', l.id);
      pm.collectionVariables.set('dspVin', l.vin);
