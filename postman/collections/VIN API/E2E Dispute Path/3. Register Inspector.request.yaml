$kind: http-request
name: '3. Register Inspector'
order: 300
method: POST
url: '{{baseUrl}}/api/actors'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "role": "inspector",
      "displayName": "Dispute Inspector",
      "email": "dsp.inspector.{{$timestamp}}@vin.demo",
      "countryCode": "ID",
      "city": "Surabaya"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('register inspector 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      pm.collectionVariables.set('dspInspectorId', pm.response.json().actor.id);
