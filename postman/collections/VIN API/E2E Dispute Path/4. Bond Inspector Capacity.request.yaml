$kind: http-request
name: '4. Bond Inspector Capacity'
order: 400
method: POST
url: '{{baseUrl}}/api/actors/:id/bonds'
pathVariables:
  - key: id
    value: '{{dspInspectorId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amount": "500",
      "currency": "USDC",
      "purpose": "inspection_capacity"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('bond capacity 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
