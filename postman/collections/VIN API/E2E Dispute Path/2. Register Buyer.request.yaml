$kind: http-request
name: '2. Register Buyer'
order: 200
method: POST
url: '{{baseUrl}}/api/actors'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "role": "buyer",
      "displayName": "Dispute Buyer",
      "email": "dsp.buyer.{{$timestamp}}@vin.demo",
      "countryCode": "SG",
      "city": "Singapore"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('register buyer 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      pm.collectionVariables.set('dspBuyerId', pm.response.json().actor.id);
