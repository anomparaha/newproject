$kind: http-request
name: '13. Reset - Upload Report (60000 km) baseline not reset'
order: 1300
method: POST
url: '{{baseUrl}}/api/deals/:id/reports'
pathVariables:
  - key: id
    value: '{{regRstDealId}}'
headers:
  - key: Content-Type
    value: application/json
  - key: x-actor-id
    value: '{{regInspectorId}}'
body:
  type: json
  content: |-
    {
      "inspectorId": "{{regInspectorId}}",
      "odometerKm": 60000,
      "inspectedAt": "2026-10-02T10:00:00.000Z",
      "reportHash": "{{sha256}}",
      "dashboardPhotoHash": "{{sha256}}",
      "conditionSummary": "Reset case: the VIN was relisted at 50,000 km after a 90,000 km record. A reading of 60,000 km must STILL be flagged against the highest (90,000 km) baseline, proving a low relist cannot reset the comparison point.",
      "standardVersion": "vin-report-v1",
      "checklist": {
        "vin_matches_unit": true,
        "dashboard_photo": true,
        "odometer_documented": true,
        "main_condition": true,
        "date_and_location": true
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('reset report 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      const b = pm.response.json();
      pm.test('odometer anomaly flagged (reset, baseline not reset)', () => pm.expect(b.anomaly && b.anomaly.flagged).to.eql(true));
