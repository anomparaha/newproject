$kind: http-request
name: '1. Setup - Load Demo Actors'
order: 100
method: GET
url: '{{baseUrl}}/api/demo/actors'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('demo actors 200', () => pm.response.to.have.status(200));
      const a = pm.response.json().actors || [];
      const by = r => (a.find(x => x.role === r) || {}).id;
      pm.collectionVariables.set('regSellerId', by('seller'));
      pm.test('seller captured', () => pm.expect(pm.collectionVariables.get('regSellerId')).to.be.a('string').and.not.empty);
