$kind: http-request
name: '5. Control - Create Listing (90000 km)'
order: 500
method: POST
url: '{{baseUrl}}/api/listings'
headers:
  - key: Content-Type
    value: application/json
  - key: x-actor-id
    value: '{{regSellerId}}'
body:
  type: json
  content: |-
    {
      "vin": "ODOREGCTRL{{$timestamp}}",
      "sellerId": "{{regSellerId}}",
      "make": "Toyota",
      "model": "Regression Fixture",
      "year": 2020,
      "odometerKm": 90000,
      "location": "Jakarta, Indonesia",
      "priceAmount": "8000",
      "priceCurrency": "USDC",
      "shippingTerms": "FOB Jakarta; buyer covers freight.",
      "photoHashes": ["{{sha256}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('create control listing 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      const b = pm.response.json(); const l = b.listing || b;
      pm.collectionVariables.set('regCtrlListingId', l.id);
      pm.test('fresh VIN -> no odometer warning', () => pm.expect(Boolean(b.odometerWarning && b.odometerWarning.flagged)).to.eql(false));
