$kind: http-request
name: '7. Control - Fund Deal'
description: |-
  Odometer-baseline regression step: 7. Control - Fund Deal. Proves a VIN's highest recorded odometer cannot be reset by relisting the same car at a lower reading.

  `POST /api/deals/:id/fund` Requires an `x-actor-id` header identifying the caller.
order: 700
method: POST
url: '{{baseUrl}}/api/deals/:id/fund'
pathVariables:
  - key: id
    value: '{{regCtrlDealId}}'
headers:
  - key: x-actor-id
    value: '{{regBuyerId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('fund control 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      pm.test('state inspecting', () => pm.expect(pm.response.json().deal.state).to.eql('inspecting'));
