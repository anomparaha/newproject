$kind: http-request
name: '9. Reset - Create Listing (90000 km)'
order: 900
method: POST
url: '{{baseUrl}}/api/listings'
headers:
  - key: Content-Type
    value: application/json
  - key: x-actor-id
    value: '{{regSellerId}}'
body:
  type: json
  content: |-
    {
      "vin": "{{regRstVin}}",
      "sellerId": "{{regSellerId}}",
      "make": "Toyota",
      "model": "Regression Fixture",
      "year": 2020,
      "odometerKm": 90000,
      "location": "Jakarta, Indonesia",
      "priceAmount": "8000",
      "priceCurrency": "USDC",
      "shippingTerms": "FOB Jakarta; buyer covers freight.",
      "photoHashes": ["{{sha256}}"]
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('regRstVin', 'ODOREGRST' + Date.now());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('create reset listing (high) 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      pm.test('first listing of this VIN -> no warning', () => { const b = pm.response.json(); pm.expect(Boolean(b.odometerWarning && b.odometerWarning.flagged)).to.eql(false); });
