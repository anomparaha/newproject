$kind: http-request
name: '2. Register Buyer'
description: |-
  Odometer-baseline regression step: 2. Register Buyer. Proves a VIN's highest recorded odometer cannot be reset by relisting the same car at a lower reading.

  `POST /api/actors`
order: 200
method: POST
url: '{{baseUrl}}/api/actors'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "role": "buyer",
      "displayName": "Regression Buyer",
      "email": "reg.buyer.{{$timestamp}}@vin.demo",
      "countryCode": "SG",
      "city": "Singapore"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('register buyer 2xx', () => pm.expect(pm.response.code, pm.response.text()).to.be.within(200,299));
      pm.collectionVariables.set('regBuyerId', pm.response.json().actor.id);
