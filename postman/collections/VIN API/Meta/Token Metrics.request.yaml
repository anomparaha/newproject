$kind: http-request
name: Token Metrics
description: |-
  The only token metric the platform claims: locked bonds by currency, active stakeholders, and the count of bonds slashed/returned.

  `GET /api/metrics/token`
order: 3000
method: GET
url: '{{baseUrl}}/api/metrics/token'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('lockBonds array', () => { pm.expect(b).to.have.property('lockBonds'); pm.expect(b.lockBonds).to.be.an('array'); });
      }
