$kind: http-request
name: Policy
description: |-
  All public platform policy in one place so it can be audited: fees, bonds, capacity, token utility, publication stages, and halt thresholds.

  `GET /api/meta/policy`
order: 2000
method: GET
url: '{{baseUrl}}/api/meta/policy'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('no server error', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('json response', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      if (pm.response.code < 300) {
        const b = pm.response.json();
        pm.test('has platform', () => pm.expect(b).to.have.property('platform'));
      }
